<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R. Cassa – Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a8ca3'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a8ca3">
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--blue:#0a8ca3;--blue-soft:#e3f5f8;--green:#30a46c;--green-soft:#e6f6ee;--amber:#d98200;--amber-soft:#fff4e0;--red:#e5484d;--red-soft:#fdeceb;--r:16px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#2c2c2e;--blue:#3cc3d9;--blue-soft:#0b2e36;--green-soft:#0e2e1e;--amber-soft:#33250a;--red-soft:#3a1517;--sh:none}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{padding:20px 14px;overflow-y:auto;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.brand{font-weight:700;font-size:18px;padding:4px 12px 16px;display:flex;gap:8px;align-items:center}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#30b0c8,#0a8ca3);display:inline-block}
.nav{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--ink);text-align:left;width:100%}
.nav:hover{background:var(--line)}.nav.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav .ic{width:20px;text-align:center;font-size:16px}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.sp{flex:1}.who{font-size:12px;color:var(--mute);padding:8px 12px}
main{padding:64px 36px 60px;max-width:1280px}
h1{font-size:30px;letter-spacing:-.02em}.sub{color:var(--mute);margin:2px 0 22px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:3fr 2fr}
.kpi .l{color:var(--mute);font-size:13px}.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.kpi .d{font-size:13px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}
h3{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
h3 a{font-size:13px;color:var(--blue);font-weight:500;cursor:pointer}
.btn{background:var(--blue);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}.btn.sm{padding:5px 12px;font-size:13px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600}.row .t span{color:var(--mute);font-size:13px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;flex:none}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.p-g{background:var(--green-soft);color:var(--green)}.p-a{background:var(--amber-soft);color:var(--amber)}.p-r{background:var(--red-soft);color:var(--red)}.p-b{background:var(--blue-soft);color:var(--blue)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--blue)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:8px 10px}td{padding:12px 10px;border-top:1px solid var(--line)}
tr.click:hover td{background:var(--bg);cursor:pointer}
input[type=search],input[type=text],select,textarea{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.hide{display:none!important}
/* planning */
.pl{display:grid;grid-template-columns:150px repeat(5,1fr);gap:6px;font-size:13px}
.pl .h{color:var(--mute);text-align:center;padding:4px;font-weight:600}.pl .h.today{color:var(--blue)}
.pl .n{display:flex;gap:8px;align-items:center;font-weight:600;padding:4px 0}
.cell{min-height:58px;border-radius:10px;background:var(--bg);padding:4px;display:flex;flex-direction:column;gap:4px;border:2px dashed transparent;transition:.15s}
.cell.over{border-color:var(--blue);background:var(--blue-soft)}
.chip{border-radius:8px;padding:5px 8px;font-size:12px;line-height:1.25;cursor:grab;color:#fff;position:relative}
.chip small{opacity:.85;display:block}.chip .rep{position:absolute;right:6px;top:4px;opacity:.8}
.c1{background:#0a8ca3}.c2{background:#30a46c}.c3{background:#8e5cd9}.c4{background:#e08a00}.c0{background:#8e8e93}
.gt{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center;font-size:12px}.gh{position:relative;height:18px;color:var(--mute)}.gh span{position:absolute;transform:translateX(-50%)}.gn{line-height:1.2}.gn b{font-size:13px;display:block}.gn span{color:var(--mute);font-size:11px}.gr{position:relative;height:34px;background:var(--bg);border-radius:10px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),var(--line) calc(12.5% - 1px),var(--line) 12.5%)}.gl{position:absolute;top:16px;height:3px;background:var(--line);border-radius:3px}.gc{position:absolute;top:4px;height:26px;border-radius:7px;color:#fff;font-size:11px;font-weight:600;padding:5px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gd{position:absolute;top:8px;transform:translateX(-50%);font-size:14px}.gv{position:absolute;left:12px;top:9px;color:var(--mute)}
.hint{background:var(--blue-soft);color:var(--blue);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
/* portal */
.portal{background:linear-gradient(180deg,#eaf3ff,var(--bg) 260px)}
@media(prefers-color-scheme:dark){.portal{background:var(--bg)}}
.tile{border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;background:var(--card);transition:.15s}.tile:hover{border-color:var(--blue);transform:translateY(-2px)}
.tile .e{font-size:26px}.tile b{display:block;margin-top:6px}.tile span{color:var(--mute);font-size:13px}
.chat{display:flex;flex-direction:column;gap:8px}.msg{max-width:78%;padding:9px 14px;border-radius:18px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}.msg.th{align-self:flex-start;background:var(--bg)}
.check{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.check input{width:20px;height:20px;accent-color:var(--green)}
.phone{width:300px;border:8px solid #1d1d1f;border-radius:38px;padding:16px 14px;background:var(--bg);margin:auto}
.big{width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;background:var(--green);color:#fff}.big.stop{background:var(--red)}
.ai{background:linear-gradient(135deg,#e3f5f8,#f0fafb);border-radius:14px;padding:14px;color:#1d1d1f;font-size:14px}
@media(prefers-color-scheme:dark){.ai{background:#0f2a31;color:#f5f5f7}}
.gf{grid-template-columns:minmax(300px,1fr) minmax(320px,1.15fr)}.gc{grid-template-columns:200px 1fr 300px}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.qa button{background:var(--card);box-shadow:var(--sh);border-radius:99px;padding:9px 16px;font-size:14px;font-weight:500;display:flex;gap:8px;align-items:center;transition:.15s}.qa button:hover{transform:translateY(-1px);color:var(--blue)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main>*{animation:up .4s cubic-bezier(.2,.7,.2,1) both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(5){animation-delay:.16s}
.card:hover{box-shadow:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:1px}
::selection{background:var(--blue-soft)}
.msec{width:100%;text-align:left;cursor:pointer}.msec:hover{color:var(--ink)}
.demo{display:inline-block;background:var(--amber-soft);color:var(--amber);padding:2px 9px;border-radius:99px;font-weight:600;margin-bottom:4px}
.nav.more.hide{display:none}
#wel{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 30% 20%,#9fdde9 0,transparent 45%),radial-gradient(circle at 80% 80%,#d6eef2 0,transparent 45%),var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#wel.gone{opacity:0;pointer-events:none;visibility:hidden}
#wel .lg{width:120px;display:block;margin:0 auto 14px}.sky{position:absolute;bottom:0;left:0;width:100%;height:min(22vh,150px);object-fit:cover;object-position:center bottom;opacity:.95;pointer-events:none}#wel>.wc{position:relative;z-index:1;margin-top:-10vh}
#wel h1{font-size:44px;letter-spacing:-.03em}#wel p{color:var(--mute);margin:8px 0 22px;font-size:17px}
#tour{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:min(420px,92vw);background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:18px;z-index:15;animation:up .3s both}
.skyw{position:absolute;left:0;right:0;bottom:-1px;height:calc(min(100vw,1000px)/4.19);pointer-events:none}.skyw:before{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(min(100vw,1000px)/4.19*.22);background:#093c55}.skyw img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,1000px);height:auto;display:block}
.alarm{background:var(--red-soft);border:2px solid var(--red);border-radius:16px;padding:14px;text-align:center;margin-bottom:10px;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}50%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
#push{position:fixed;top:14px;right:14px;width:min(360px,92vw);background:var(--card);border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.3);padding:12px 14px;z-index:40;animation:up .3s both}
.fl{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}.fl input,.fl select,.fl textarea{margin-top:4px;color:var(--ink)}
.fh{font-weight:700;margin:14px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
#pm{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:22;display:flex;justify-content:center;align-items:flex-start;padding:5vh 12px;overflow:auto}
#pm>div{background:var(--card);width:min(560px,100%);border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
#rm{position:fixed;z-index:25;background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:216px;padding:6px 0}#rm .pi{padding:8px 14px}
.brand img{display:block}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:14px 12px 4px;font-weight:600}
.sw{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}.sw input{width:18px;height:18px;accent-color:var(--blue)}
.card{transition:box-shadow .15s}.top h1{font-weight:700}
input[type=range]{accent-color:var(--blue)}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);z-index:20;display:flex;justify-content:center;padding-top:14vh}
#pal>div{background:var(--card);width:min(520px,92vw);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);height:fit-content;overflow:hidden}
#pin{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 20px;font-size:17px;outline:0}
.pi{display:flex;justify-content:space-between;width:100%;padding:11px 20px;text-align:left}.pi:hover{background:var(--blue-soft)}.pi small{color:var(--mute)}
.sbtn{padding:7px 14px;border-radius:99px;background:var(--card);box-shadow:var(--sh);color:var(--mute);font-size:13px;margin-right:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}
#langSel{width:auto;padding:6px 12px;border-radius:99px;margin-right:8px;font-size:14px;background:var(--card);box-shadow:var(--sh);border:0}
.mode{position:fixed;top:14px;right:18px;z-index:8;display:flex;align-items:center}
.mode.flow{position:static;justify-content:center;padding:12px;background:var(--bg);flex-wrap:wrap;gap:8px}.mode.flow .sbtn{margin-right:0}
@media(max-width:1100px){.gc{grid-template-columns:1fr}.gc>.card:first-child{display:flex;flex-wrap:wrap}}
@media(max-width:900px){.nav.more.hide{display:flex!important}.msec{display:none}#tour{bottom:92px}.gf{grid-template-columns:1fr}#invpv{max-width:100%}.top h1{font-size:24px}.sec{display:none}.app{grid-template-columns:1fr}aside{position:fixed;bottom:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;z-index:7;border-top:1px solid var(--line);border-right:0;padding:6px}.brand,.who,.sp{display:none}.nav{flex-direction:column;gap:2px;font-size:11px;width:auto;min-width:64px;padding:6px}.nav .badge{position:absolute;margin:0;transform:translate(14px,-6px)}main{padding:20px 16px 100px}.g4,.g3,.g2{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.pl{grid-template-columns:90px repeat(5,minmax(110px,1fr));overflow-x:auto}.mode,.mode.flow{position:static;justify-content:center;padding:10px 12px;background:var(--bg);flex-wrap:wrap;gap:6px}.mode .sbtn{margin-right:0;padding:6px 10px}}
</style>
</head>

<div class="mode"><select id="langSel" onchange="setLang(this.value)" title="Taal / Language" aria-label="Taal"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="pt">Português</option><option value="hi">हिन्दी</option></select><button class="sbtn" onclick="pal(true)">🔍 Zoeken · ⌘K</button><button class="sbtn" onclick="showNotifs()" title="Meldingen">🔔<span id="bn" style="margin-left:4px;color:var(--red);font-weight:700"></span></button><div class="seg" id="modeSeg"><button class="on" data-m="office">Kantoor</button><button data-m="portal">Klantportaal</button><button data-m="app">Medewerker-app</button></div></div>
<div id="root"></div>
<div id="tour" class="hide"></div>
<div id="rm" class="hide"></div>
<div id="push" class="hide"></div>
<div id="pm" class="hide" onclick="if(event.target===this)closeM()"></div>
<div id="wel"><div class="wc" style="text-align:center;max-width:520px;padding:24px"><img class="lg" id="wlogo" alt="R. Cassa"><h1>Welkom</h1><p>Voorbeeld voor C.J. Kam</p><div style="color:var(--mute);margin:-8px 0 26px;font-size:15px">Schoonmaakbeheer zoals het hoort te voelen: rustig, snel en helemaal op maat. Alle gegevens in deze demo zijn fictief.</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" style="padding:13px 26px;font-size:16px" onclick="welcome(true)">Start rondleiding</button><button class="btn ghost" style="padding:13px 26px;font-size:16px" onclick="welcome(false)">Zelf verkennen</button></div></div><div class="skyw"><img id="wsky" alt=""></div></div>
<div id="pal" class="hide" onclick="if(event.target===this)pal(false)"><div><input id="pin" type="text" placeholder="Zoek een klant, medewerker of actie…" oninput="palList(this.value)"><div id="plist"></div></div></div>

function pal(open){const p=$('#pal');if(!open){p.classList.add('hide');return}p.classList.remove('hide');const i=$('#pin');i.value='';palList('');i.focus()}
function palList(q){q=q.toLowerCase();const it=[...ACT.map(a=>[a[0],()=>go(a[1]),'Ga naar']),...clients.actief.map((c,i)=>[c[0],()=>{go('klant');sel.klant=i;render()},'Klant']),...staff.map((s,i)=>[s.n,()=>{go('team');sel.team=i;render()},'Medewerker']),['Nieuwe opdracht',()=>{sel.opdr=-1;go('opdr')},'Actie'],['Nieuwe dienst plannen',()=>go('plan'),'Actie'],['Factuur ontwerpen',()=>go('fact'),'Actie']].filter(x=>x[0].toLowerCase().includes(q)).slice(0,8);
 window._pi=it;$('#plist').innerHTML=it.map((x,i)=>`<button class="pi" onclick="pal(false);_pi[${i}][1]()"><span>${x[0]}</span><small>${x[2]}</small></button>`).join('')||'<div style="padding:14px;color:var(--mute)">Niets gevonden</div>'}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal(true)}if(e.key==='Escape')pal(false);if(e.key==='Enter'&&!$('#pal').classList.contains('hide')&&window._pi?.[0]){pal(false);_pi[0][1]()}});
