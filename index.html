<div id="wel"><div style="text-align:center;max-width:520px;padding:24px"><div class="lg"></div><h1>Schoonwerk</h1><p>Voorbeeld voor C.J. Kam</p><div style="color:var(--mute);margin:-8px 0 26px;font-size:15px">Schoonmaakbeheer zoals het hoort te voelen: rustig, snel en helemaal op maat. Alle gegevens in deze demo zijn fictief.</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" style="padding:13px 26px;font-size:16px" onclick="welcome(true)">Start rondleiding</button><button class="btn ghost" style="padding:13px 26px;font-size:16px" onclick="welcome(false)">Zelf verkennen</button></div></div></div>

/* ---------- fictieve data ---------- */

V.plan=()=>{

 <div style="display:grid;gap:14px"><div class="card"><div style="display:flex;gap:10px;align-items:center"><span class="pill" style="background:${CAT[l.c]};color:#fff">${l.c}</span></div><h3 style="margin:10px 0 2px">${l.n}</h3><div style="color:var(--mute)">${l.a}</div><div class="row"><div class="t"><b>Vandaag</b><span>06:00 · Sanne de Wit</span></div><span class="pill p-g">Gepland</span></div><div class="row"><div class="t"><b>Sleutel</b><span>Bij Sanne · NFC-tag bij ingang</span></div></div><button class="btn sm" style="margin-top:10px" onclick="go('klant')">Open klantkaart</button></div>
 <div class="card" style="padding:8px">${LOC.map((p,i)=>`<button class="nav ${i===sel.loc?'on':''}" onclick="sel.loc=${i};render()"><span style="width:10px;height:10px;border-radius:50%;background:${CAT[p.c]}"></span>${p.n}</button>`).join('')}</div></div></div>`};

<div class="seg" style="margin-bottom:16px">${Object.keys(MID).map(k=>`<button class="${sel.mid===k?'on':''}" onclick="sel.mid='${k}';render()">${MID[k][0]}</button>`).join('')}</div>
<div class="card">${MID[sel.mid][1].map((r,i)=>`<div class="row"><div class="av" style="background:${COL[i%6]}">${'🏷️🔑🧹🚐'[['nfc','keys','mach','cars'].indexOf(sel.mid)*2]}</div><div class="t"><b>${r[0]}</b><span>${r[1]}</span></div><span class="pill ${/laag|reparatie|APK|Onderhoud|Beurt/.test(r[1]+r[2])?'p-a':'p-g'}">${r[2]}</span></div>`).join('')}</div>`;

V.rap=()=>{const M=[['Jan',31],['Feb',29],['Mrt',33],['Apr',34],['Mei',35],['Jun',31],['Jul',33],['Aug',32],['Sep',35],['Okt',36],['Nov',38],['Dec',0]];

 <div class="card"><h3>Omzet per maand · 2026 <span class="pill p-g">€ 368.000 tot nu toe</span></h3><div style="display:flex;gap:10px;align-items:flex-end;height:170px">${M.map(m=>`<div style="flex:1;text-align:center"><div style="height:${m[1]*4}px;background:${m[1]?'linear-gradient(180deg,var(--blue),#4cc3ff)':'var(--line)'};border-radius:8px 8px 3px 3px;min-height:4px" title="€ ${m[1]}k"></div><div style="font-size:12px;color:var(--mute);margin-top:6px">${m[0]}</div></div>`).join('')}</div></div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>Contracturen vs. gepland</h3>${staff.map((s,i)=>{const [a,b]=s.h.split(' / ').map(Number);const p=Math.min(100,a/b*100);return `<div class="row">${av(s.n,i)}<div class="t"><b>${s.n}</b><div class="bar" style="margin-top:6px"><i style="width:${p}%;background:${p<70?'var(--amber)':'var(--green)'}"></i></div></div><span class="pill ${p<70?'p-a':'p-g'}">${a} / ${b} u</span></div>`}).join('')}</div>
 <div class="card"><h3>Omzet per klant</h3>${clients.actief.map((c,i)=>{const t=clients.actief.reduce((a,x)=>a+x[2],0);return `<div class="row"><div class="t"><b>${c[0]}</b><div class="bar" style="margin-top:6px"><i style="width:${c[2]/t*100*2}%;background:${COL[i%6]}"></i></div></div><b>${eur(c[2])}</b></div>`}).join('')}</div></div>`};

<div class="seg" style="margin-bottom:16px">${BKT.map(t=>`<button class="${sel.bk===t[0]?'on':''}" onclick="sel.bk='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
${sel.bk==='btw'?`<div class="grid g2"><div class="card"><h3>BTW Q4 2026 <span class="pill p-a">Open</span></h3>${[['1a. Omzet hoog tarief (21%)','€ 113.400'],['Verschuldigde BTW','€ 23.814'],['5b. Voorbelasting','€ 19.944'],['Te betalen','€ 3.870']].map((r,i)=>`<div class="row"><div class="t"><b>${r[0]}</b></div><b style="${i==3?'color:var(--blue);font-size:18px':''}">${r[1]}</b></div>`).join('')}<button class="btn" style="margin-top:12px" onclick="toast('Aangifte klaargezet als concept')">Concept-aangifte maken</button></div>
<div class="card"><h3>Controles</h3>${[['Alle facturen gekoppeld aan een BTW-code','p-g','OK'],['3 inkoopfacturen zonder bon','p-a','Controleer'],['Bankmutaties gematcht: 18 van 21','p-a','3 open']].map(r=>`<div class="row"><div class="t"><b>${r[0]}</b></div><span class="pill ${r[1]}">${r[2]}</span></div>`).join('')}</div></div>`
:sel.bk==='res'?`<div class="card"><h3>Resultaat november</h3>${[['Omzet',38420,100,'var(--blue)'],['Loonkosten',-23700,62,'var(--amber)'],['Inkoop en middelen',-2100,6,'var(--amber)'],['Overige kosten',-1850,5,'var(--amber)'],['Resultaat',10770,28,'var(--green)']].map(r=>`<div class="row"><div class="t"><b>${r[0]}</b><div class="bar" style="margin-top:6px"><i style="width:${r[2]}%;background:${r[3]}"></i></div></div><b>${r[1]<0?'− ':''}${eur(Math.abs(r[1]))}</b></div>`).join('')}</div>`
:`<div class="card"><h3>E-facturen (Peppol)</h3>${[['2026-0415','Sportschool Fit','Afgeleverd','p-b'],['2026-0414','Café Centraal','Geaccepteerd','p-g'],['2026-0413','VvE De Linde','Verstuurd','p-a'],['2026-0412','Kantoor Zuidas','Betaald','p-g']].map(r=>`<div class="row"><div class="t"><b>${r[0]}</b><span>${r[1]}</span></div><span class="pill ${r[3]}">${r[2]}</span></div>`).join('')}</div>`}`;

const SALD=[[0,32,0,0],[1,38,2,0],[2,24,0,-1],[3,6,0,0],[4,16,0,0]];
V.sal=()=>{const steps=['Uren gecontroleerd','Toeslagen berekend','Export gemaakt','Naar accountant'];
 return `<div class="top"><div><h1>Salaris</h1><div class="sub">Loonrun november: de uren en toeslagen die de accountant nodig heeft</div></div><button class="btn" onclick="sel.sal=Math.min(4,sel.sal+1);render();toast('Stap afgerond')">Volgende stap</button></div>
 <div class="card" style="display:flex;gap:8px;margin-bottom:16px">${steps.map((t,i)=>`<div style="flex:1;text-align:center"><div style="height:6px;border-radius:9px;background:${i<sel.sal?'var(--green)':'var(--line)'};margin-bottom:6px"></div><span style="font-size:13px;color:${i<sel.sal?'var(--green)':'var(--mute)'}">${i<sel.sal?'✓ ':''}${t}</span></div>`).join('')}</div>
 <div class="card" style="padding:6px 10px"><table><tr><th>Medewerker</th><th>Uren</th><th>Toeslag</th><th>Correctie</th><th>Status</th></tr>${SALD.map(r=>`<tr class="click"><td><div style="display:flex;gap:10px;align-items:center">${av(staff[r[0]].n,r[0])}<b>${staff[r[0]].n}</b></div></td><td>${r[1]} u</td><td>${r[2]?r[2]+' u 125%':'–'}</td><td>${r[3]?r[3]+' u':'–'}</td><td><span class="pill ${r[0]==3?'p-r':'p-g'}">${r[0]==3?'Ziek: let op':'Klaar'}</span></td></tr>`).join('')}</table></div>`};

 const body=sel.inst==='feest'?`<div class="card">${FEEST.map(f=>`<div class="row"><div class="t"><b>${f[0]}</b><span>${f[1]}</span></div><select style="width:170px"><option ${f[2].includes('200')?'selected':''}>Toeslag 200%</option><option ${f[2].includes('Normaal')?'selected':''}>Normaal tarief</option><option>Vrij</option></select></div>`).join('')}</div>`
 :sel.inst==='schema'?`<div class="card">${[['Voltijd 40 uur',[1,1,1,1,1,0,0]],['4 × 8 uur',[1,1,1,1,0,0,0]],['Ochtendploeg 06:00–12:00',[1,1,1,1,1,1,0]],['Weekend',[0,0,0,0,0,1,1]]].map(r=>`<div class="row"><div class="t"><b>${r[0]}</b></div><div style="display:flex;gap:4px">${DAG.map((d,x)=>`<span class="pill ${r[1][x]?'p-b':''}" style="${r[1][x]?'':'background:var(--bg);color:var(--mute)'}">${d}</span>`).join('')}</div></div>`).join('')}</div>`
 :sel.inst==='nieuws'?`<div class="grid g2"><div class="card"><h3>Bericht aan medewerkers</h3><textarea rows="5" oninput="news=this.value;const e=$('#nw');if(e)e.textContent=news">${news}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="toast('Verstuurd naar 5 medewerkers')">Verstuur</button><button class="btn ghost" onclick="toast('Ingepland voor maandag 07:00')">Plan in</button></div></div><div class="phone"><div style="font-size:12px;color:var(--mute)">Nieuws</div><div class="card" style="padding:12px;margin-top:8px"><b>Schoonwerk</b><div id="nw" style="font-size:14px;margin-top:4px">${news}</div></div></div></div>`
 :sel.inst==='beveil'?`<div class="grid g2"><div class="card"><h3>Inloggen</h3><label class="sw"><input type="checkbox" checked onchange="toast(this.checked?'2-staps-verificatie aan':'2-staps-verificatie uit')"><span>2-staps-verificatie (aanbevolen)</span></label><div class="row"><div class="t"><b>Laatste inlog</b><span>Vandaag 08:48 · Chrome op Linux</span></div></div></div><div class="card"><h3>API-sleutels <a onclick="toast('Nieuwe sleutel gemaakt: sk_live_••••9f2a')">+ Sleutel</a></h3><div class="row"><div class="t"><b>Boekhoudkoppeling</b><span>sk_live_••••41c8 · aangemaakt 3 okt</span></div><button class="pill p-r" onclick="toast('Sleutel ingetrokken')">Intrekken</button></div></div></div>`
 :`<div class="card"><h3>Importeren uit Excel of CSV</h3><div class="seg" style="margin-bottom:14px">${IMPT.map((t,i)=>`<button class="${sel.imp===i?'on':''}" onclick="sel.imp=${i};render()">${t}</button>`).join('')}</div><div style="border:2px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--mute);cursor:pointer" onclick="toast('Bestand gekozen: ${IMPT[sel.imp].toLowerCase()}.csv · kolommen automatisch herkend')">⬆ Sleep je bestand hierheen of klik<br><small>We herkennen de kolommen zelf</small></div>
 <table style="margin-top:14px"><tr><th>Kolom in jouw bestand</th><th>Wordt</th><th></th></tr>${[['Naam bedrijf','Naam'],['Adres','Straat'],['E-mail facturatie','Factuur-e-mail']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td><span class="pill p-g">Herkend</span></td></tr>`).join('')}</table><button class="btn" style="margin-top:12px" onclick="toast('40 ${IMPT[sel.imp].toLowerCase()} geïmporteerd (voorbeeld)')">Importeer</button></div>`;
 return `<div class="top"><div><h1>Instellingen</h1><div class="sub">Feestdagen, werkschema's, nieuws, beveiliging en importeren</div></div></div><div class="seg" style="margin-bottom:16px;max-width:100%;overflow-x:auto">${T.map(t=>`<button class="${sel.inst===t[0]?'on':''}" onclick="sel.inst='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${body}`};

/* ================= ROUND 2: welkom, rondleiding ================= */
const TOUR=[['dash','Dashboard','Alles van vandaag op één scherm: wie werkt waar, omzet, marge en wat jouw aandacht vraagt.'],['plan','Planning','Sleep een dienst naar een andere dag of persoon. Dubbelklik om te herhalen.'],['klant','Klanten','Actief, prospect en oud gescheiden. Eén klik naar de volledige klantkaart.'],['opdr','Opdrachten','Wanneer, wie, prijs en checklist op één scherm, met live marge.'],['fact','Factuurontwerp','Ontwerp zelf je factuur, per klant anders, met direct voorbeeld.'],['portal','Klantportaal','Zo ziet jouw klant het: aanvragen, volgen en berichten.'],['vergelijk','Vergelijking','Wat beter is dan Klien IT, wat gelijkwaardig is en wat nog gebouwd moet worden.']];
let tI=-1;
function tour(i){tI=i;const t=$('#tour');if(i<0||i>=TOUR.length){t.classList.add('hide');if(mode!=='office')setMode('office');return}const s=TOUR[i];if(s[0]==='portal')setMode('portal');else{if(mode!=='office')setMode('office');go(s[0])}
 t.classList.remove('hide');t.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:10px">${TOUR.map((x,n)=>`<i style="flex:1;height:4px;border-radius:9px;background:${n<=i?'var(--blue)':'var(--line)'}"></i>`).join('')}</div><b style="font-size:17px">${s[1]}</b><div style="color:var(--mute);margin:4px 0 14px">${s[2]}</div><div style="display:flex;gap:8px;justify-content:space-between"><button class="btn sm ghost" onclick="tour(-1)">Sluiten</button><div style="display:flex;gap:8px">${i>0?`<button class="btn sm ghost" onclick="tour(${i-1})">Vorige</button>`:''}<button class="btn sm" onclick="tour(${i+1})">${i===TOUR.length-1?'Klaar':'Volgende'}</button></div></div>`}
function setMode(m){mode=m;$$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));render()}
function welcome(start){$('#wel').classList.add('gone');try{sessionStorage.setItem('seen','1')}catch(e){}if(start)tour(0)}
try{if(sessionStorage.getItem('seen'))$('#wel').classList.add('gone')}catch(e){}

/* ---------- shell ---------- */
let mode='office',view='dash';
function go(v){view=v;sel.klant=null;sel.team=null;mode='office';render();$$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m==='office'))}
function render(){
 const r=$('#root');
 if(mode==='portal'){r.innerHTML=`<div class="portal" style="min-height:100vh">${V.portal()}</div>`;return}
 if(mode==='app'){r.innerHTML=V.app();return}
 r.innerHTML=`<div class="app"><aside><div class="brand"><i></i>Schoonwerk</div>${(()=>{const open=moreOpen||nav.some(n=>n[3]&&n[0]===view);return nav.map(n=>n[0]==='Meer'?`<button class="sec msec" onclick="moreOpen=!moreOpen;render()">Meer ${open?'▴':'▾'}</button>`:n.length===1?`<div class="sec">${n[0]}</div>`:`<button class="nav ${n[3]?'more':''} ${n[3]&&!open?'hide':''} ${view===n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ic">${n[1]}</span>${n[2]}${n[0]==='inbox'?'<span class="badge">2</span>':''}</button>`).join('')})()}<div class="sp"></div><div class="who"><span class="demo">Voorbeeld · fictieve data</span><br>C.J. Kam · Eigenaar</div></aside><main>${V[view]()}</main></div>`;
 if(view==='plan')wirePlan();if(view==='opdr')upd();if(view==='uren')tolU();if(view==='chk')pv();
}
$$('#modeSeg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$$('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));render()});
render();
</script>
